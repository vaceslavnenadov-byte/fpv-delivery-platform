[defaults]
inventory = inventory/local/hosts.yml
roles_path = roles
filter_plugins = ./filter_plugins
collections_path = ./collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = /usr/bin/python3
forks = 10
timeout = 30
# Секреты не выводятся: задачи с секретами помечены no_log: true.
display_args_to_stdout = False
log_path = ./logs/ansible.log
any_errors_fatal = False
nocows = True

[privilege_escalation]
# become включается только на уровне задач/плеев, которым нужны права root.
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
