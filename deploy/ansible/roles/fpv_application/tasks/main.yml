---
- name: Проверка наличия архива приложения
  ansible.builtin.assert:
    that: [fpv_app_archive | length > 0]
    fail_msg: "Не задан архив приложения (FPV_APP_ARCHIVE). Соберите комплект scripts/build-bundle.sh."
    quiet: true

- name: Контрольная сумма архива приложения
  ansible.builtin.stat:
    path: "{{ fpv_app_archive }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: fpv_app_archive_stat

- name: Архив приложения существует
  ansible.builtin.assert:
    that: [fpv_app_archive_stat.stat.exists]
    fail_msg: "Архив {{ fpv_app_archive }} не найден"
    quiet: true

- name: Каталог релиза
  ansible.builtin.set_fact:
    fpv_app_release_id: "{{ fpv_release }}-{{ fpv_app_archive_stat.stat.checksum[:12] }}"
    fpv_app_release_dir: "{{ fpv_install_root }}/releases/{{ fpv_release }}-{{ fpv_app_archive_stat.stat.checksum[:12] }}"

- name: Системные пакеты приложения
  ansible.builtin.apt:
    name: "{{ fpv_app_packages }}"
    state: present
  become: true
  when: fpv_manage_packages | bool

- name: Каталоги релизов и данных
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ fpv_install_root }}/releases", mode: "0755" }
    - { path: "{{ fpv_app_release_dir }}", mode: "0755" }
    - { path: "{{ fpv_app_video_spool_dir }}", owner: "{{ fpv_service_user }}", group: "{{ fpv_service_group }}", mode: "0750" }
    - { path: "{{ fpv_app_object_store_root }}", owner: "{{ fpv_service_user }}", group: "{{ fpv_service_group }}", mode: "0750" }
  become: true

- name: Распаковка приложения
  ansible.builtin.unarchive:
    src: "{{ fpv_app_archive }}"
    dest: "{{ fpv_app_release_dir }}"
    owner: root
    group: root
    creates: "{{ fpv_app_release_dir }}/backend/fpv/__init__.py"
  become: true

- name: Виртуальное окружение приложения
  ansible.builtin.command:
    argv: ["{{ fpv_app_python }}", -m, venv, "{{ fpv_app_release_dir }}/venv"]
    creates: "{{ fpv_app_release_dir }}/venv/bin/python"
  become: true

- name: Python-зависимости приложения (закреплённые версии с хешами)
  ansible.builtin.pip:
    requirements: "{{ fpv_app_release_dir }}/backend/requirements.lock"
    virtualenv: "{{ fpv_app_release_dir }}/venv"
    extra_args: >-
      --require-hashes --no-cache-dir
      {{ ('--no-index --find-links ' + fpv_pip_wheelhouse) if fpv_pip_wheelhouse | length > 0 else '' }}
      {{ ('--index-url ' + fpv_pip_index_url) if fpv_pip_index_url | length > 0 else '' }}
  become: true

- name: Зависимости S3-совместимого хранилища (только при fpv_app_object_store = s3)
  ansible.builtin.pip:
    requirements: "{{ fpv_app_release_dir }}/backend/requirements-s3.lock"
    virtualenv: "{{ fpv_app_release_dir }}/venv"
    extra_args: >-
      --require-hashes --no-cache-dir
      {{ ('--no-index --find-links ' + fpv_pip_wheelhouse) if fpv_pip_wheelhouse | length > 0 else '' }}
  become: true
  when: fpv_app_object_store == 's3'

- name: Файлы секретов (только для root и группы службы)
  ansible.builtin.copy:
    dest: "{{ fpv_config_dir }}/secrets/{{ item.name }}"
    content: "{{ item.value }}"
    owner: root
    group: "{{ fpv_service_group }}"
    mode: "0640"
  loop:
    - name: database_url
      value: "postgresql+psycopg://{{ fpv_app_database_user }}:{{ fpv_app_database_password | urlencode }}@{{ fpv_app_database_host }}:{{ fpv_app_database_port }}/{{ fpv_app_database_name }}?sslmode={{ fpv_app_database_sslmode }}"
    - name: ldap_bind_password
      value: "{{ fpv_app_ldap_bind_password }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  become: true
  notify: Перезапустить приложение

- name: Конфигурация приложения (без секретов)
  ansible.builtin.template:
    src: fpv.env.j2
    dest: "{{ fpv_config_dir }}/fpv.env"
    owner: root
    group: "{{ fpv_service_group }}"
    mode: "0640"
  become: true
  notify: Перезапустить приложение

- name: Миграции PostgreSQL (идемпотентны, сериализованы блокировкой)
  ansible.builtin.command:
    argv: ["{{ fpv_app_release_dir }}/venv/bin/python", -m, fpv.migrate]
    chdir: "{{ fpv_app_release_dir }}/backend"
  environment:
    FPV_DATABASE_URL_FILE: "{{ fpv_config_dir }}/secrets/database_url"
    FPV_ENVIRONMENT: "{{ fpv_environment }}"
    FPV_DIRECTORY_PROVIDER: ldap
    FPV_LDAP_URI: "{{ fpv_domain_ldap_uri }}"
  register: fpv_app_migrate
  changed_when: "'Применены: нет' not in fpv_app_migrate.stdout"
  run_once: true
  become: true
  become_user: "{{ fpv_service_user }}"
  when: fpv_app_run_migrations | bool

- name: Предыдущий активный релиз
  ansible.builtin.stat:
    path: "{{ fpv_install_root }}/current"
  register: fpv_app_current

- name: Сохранение ссылки на предыдущий релиз (для отката)
  ansible.builtin.copy:
    dest: "{{ fpv_install_root }}/previous-release"
    content: "{{ fpv_app_current.stat.lnk_source }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - fpv_app_current.stat.exists and fpv_app_current.stat.islnk
    - fpv_app_current.stat.lnk_source != fpv_app_release_dir

- name: Активация релиза
  ansible.builtin.file:
    src: "{{ fpv_app_release_dir }}"
    dest: "{{ fpv_install_root }}/current"
    state: link
    force: true
  become: true
  notify: Перезапустить приложение

- name: Журнал установленных релизов
  ansible.builtin.lineinfile:
    path: "{{ fpv_install_root }}/releases.log"
    line: "{{ fpv_app_release_id }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Systemd-юниты API и воркера
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [fpv-api.service, fpv-worker.service]
  become: true
  notify: [Перечитать systemd, Перезапустить приложение]

- name: Веб-сервер nginx (TLS, прокси API и WebSocket, статика frontend)
  ansible.builtin.template:
    src: nginx-fpv.conf.j2
    dest: /etc/nginx/sites-available/fpv.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: fpv_nginx_enabled | bool and fpv_manage_packages | bool
  notify: Перезагрузить nginx

- name: Включение сайта nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/fpv.conf
    dest: /etc/nginx/sites-enabled/fpv.conf
    state: link
  become: true
  when: fpv_nginx_enabled | bool and fpv_manage_packages | bool
  notify: Перезагрузить nginx

- name: Службы приложения
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: [fpv-api, fpv-worker]
  become: true
  when: fpv_manage_services | bool
