# Inventory автоматических проверок в контейнере Debian 11 (python:3.9-slim-bullseye):
# нет доступа к зеркалу пакетов и нет systemd, комплект запускается от root.
# Переопределения заданы на уровне узла: переменные узла в inventory имеют приоритет
# над playbook group_vars/all (переменные группы all в inventory — нет).
all:
  children:
    datacenter:
      children:
        app_servers:
          hosts:
            localhost:
              ansible_connection: local
              ansible_python_interpreter: /usr/local/bin/python3
              fpv_environment: test
              fpv_manage_packages: false
              fpv_manage_services: false
              fpv_domain_join_enabled: false
              fpv_app_run_migrations: false
              fpv_app_python: /usr/local/bin/python3
              # Контейнер выполняется от root без sudo: повышение привилегий не требуется.
              ansible_become: false
