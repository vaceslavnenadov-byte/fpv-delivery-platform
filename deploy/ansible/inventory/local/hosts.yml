# Режим 1: локальная установка. Комплект скопирован в /tmp/ancible на целевом узле,
# Ansible управляет только этим узлом через локальное подключение.
# Группа узла задаётся явно параметром --group скрипта install.sh (см. docs/deployment.md);
# по умолчанию узел ни в одной функциональной группе и получает только базовые роли.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      fpv_environment: production
