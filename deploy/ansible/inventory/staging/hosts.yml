# Тестовое окружение: все серверные функции на одном узле Debian 13.
all:
  vars:
    ansible_user: ansible-deploy
  children:
    datacenter:
      children:
        app_servers:
          hosts:
            stage1.test.fpv.local:
        db_servers:
          hosts:
            stage1.test.fpv.local:
              fpv_postgresql_primary: true
        file_servers:
          hosts:
            stage1.test.fpv.local:
    workstations:
      children:
        operator_workstations:
          hosts:
            ws-test-01.test.fpv.local:
