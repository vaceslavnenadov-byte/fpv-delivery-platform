# Режим 2: централизованное развёртывание с управляющего узла по SSH.
# Пример inventory ЦОД. Имена узлов и адреса заменить фактическими.
all:
  vars:
    ansible_user: ansible-deploy        # доменная служебная учётная запись с ключом SSH
  children:
    datacenter:
      children:
        app_servers:
          hosts:
            app1.dc.fpv.local:
            app2.dc.fpv.local:
        db_servers:
          hosts:
            db1.dc.fpv.local:
              fpv_postgresql_primary: true
        file_servers:
          hosts:
            fs1.dc.fpv.local:
        monitoring_servers:
          hosts:
            mon1.dc.fpv.local:
    workstations:
      children:
        operator_workstations:
          hosts:
            ws-ops-01.fpv.local:
        coordinator_workstations:
          hosts:
            ws-coord-01.fpv.local:
        technician_workstations:
          hosts:
            ws-tech-01.fpv.local:
        admin_workstations:
          hosts:
            ws-adm-01.fpv.local:
    ground_stations:
      hosts:
        gs-01.fpv.local:
